# Based on https://github.com/wordpress/plugin-dependencies
name: CI simple-taxonomy-refreshed

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Manual run: no previous commit to compare with, so the blocks are always rebuilt.
  workflow_dispatch:

# Every job only reads the repository (Codecov uses its own token secret).
permissions:
  contents: read

jobs:
  # Rebuilds build/blocks when src/ (or package.json) changed, so the tests use the blocks as src/ defines them.
  # Nothing is committed: the manual Build Blocks workflow still opens the PR with build/.
  build-blocks:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Compare with the PR's base, or with the commit before the push.
      # With no usable base (first push of a branch, force push), build anyway.
      - name: Check for src changes
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- src package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Dependency install hooks are not needed for the build.
      - name: Build blocks
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm install --ignore-scripts
          npm run build:blocks

      - name: Upload block build
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-blocks
          path: build/blocks/
          if-no-files-found: error
          retention-days: 1

  run:
    needs: build-blocks
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: true
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['8.2', '8.3', '8.4']
        wp-version: ['6.9', latest]
        wp-multisite: [0]
        phpunit-versions: ['9.5']
        phpunit-config: ['phpunit9.xml']
        include:
          - php-versions: '8.4'
            wp-version: 'latest'
            wp-multisite: 1
            phpunit-versions: '9.5'
            phpunit-config: 'phpunit9.xml'
            operating-system: 'ubuntu-latest'
    name: PHP ${{ matrix.php-versions }} Test WP ${{ matrix.wp-version }} MS ${{ matrix.wp-multisite }} ${{ matrix.operating-system }}
    steps:
    - name: Start DB
      run: sudo systemctl start mysql

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # src/ changed: replace build/blocks with the fresh build from the build-blocks job.
    - name: Remove committed block build
      if: needs.build-blocks.outputs.changed == 'true'
      run: rm -rf build/blocks

    - name: Download block build
      if: needs.build-blocks.outputs.changed == 'true'
      uses: actions/download-artifact@v8
      with:
        name: build-blocks
        path: build/blocks

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mysqli
        coverage: xdebug
        tools: wp-cli, phpunit:${{ matrix.phpunit-versions }}
      env:
        COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check PHP Version
      run: php -v

    - name: Composer install
      run: composer install --optimize-autoloader --prefer-dist

    - name: Install WP Tests
      run: bash script/install-wp-tests wordpress_test root root 127.0.0.1 ${{ matrix.wp-version }}
      env:
        WP_MULTISITE: ${{ matrix.wp-multisite }}

    - name: phpunit tests
      run: |
        echo "define('WP_TESTS_PHPUNIT_POLYFILLS_PATH', '${{ github.workspace }}/vendor/yoast/phpunit-polyfills');" >> /tmp/wordpress-tests-lib/wp-tests-config.php
        /usr/local/bin/phpunit --config=${{ matrix.phpunit-config }}
      env:
        WP_MULTISITE: ${{ matrix.wp-multisite }}

    - name: Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        directory: ${{ github.workspace }}
        verbose: true
        # One flag per upload (Codecov rejects several): one per matrix combination.
        flags: php${{ matrix.php-versions }}-wp${{ matrix.wp-version }}-ms${{ matrix.wp-multisite }}

  phpcs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: [8.4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mysqli

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      # composer puts the phpcs binary in bin/ (see composer.json bin-dir).
      - name: phpcs
        run: bin/phpcs --standard=phpcs.ruleset.xml -p -s --colors *.php includes/*.php tests/*.php

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Settings in phpstan.neon.dist; existing issues are listed in phpstan-baseline.neon.
      - name: phpstan
        run: bin/phpstan analyse --no-progress --memory-limit=2G --error-format=github
