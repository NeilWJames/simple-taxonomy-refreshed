name: "CodeQL"

on:
  push:
    branches: [ master ]
    # A change to the translation template only (the Generate POT PR) needs no tests.
    paths-ignore:
      - 'languages/**'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
    # A change to the translation template only (the Generate POT PR) needs no tests.
    paths-ignore:
      - 'languages/**'
  schedule:
    - cron: '41 4 13 * *'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # javascript: plugin JS in src/. actions: the workflows in .github/workflows.
        language: [ 'javascript-typescript', 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Both languages are interpreted, so no build step is needed.
    # build/ holds minified copies of src/ and only adds noise.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        config: |
          paths-ignore:
            - build/**

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
