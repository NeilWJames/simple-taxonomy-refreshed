name: Generate POT file

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pot:
    # workflow_dispatch can't be limited to a branch, so skip runs started from any other branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # WP-CLI's make-pot reads PHP, JS and block.json strings.
      - name: Setup PHP with WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: wp-cli

      - name: Generate POT file
        run: bash script/generate-pot

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
            commit-message: "Update POT file"
            title: "Update POT file"
            branch: automated/generate-pot
            delete-branch: true
