name: Build Blocks

on:
  workflow_dispatch:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run npm install
        run: npm install

      - name: Run Build	
        run: npm run build

      - name: Open PR with build output
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Build blocks [automated]"
          title: "Automated block build"
          body: |
            Auto-generated by the Build Blocks workflow, triggered from `master`.

            Rebuilds `build/` from current `src/`.
          branch: automated/build-blocks
          delete-branch: true
