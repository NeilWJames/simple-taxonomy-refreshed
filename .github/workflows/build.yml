name: Build Blocks and Compress JS/CSS

on:
  workflow_dispatch:

# Read-only by default; only the pr job gets write access.
permissions:
  contents: read

jobs:
  # Runs npm with no write token available.
  build:
    # workflow_dispatch can't be limited to a branch, so skip runs started from any other branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Dependency install hooks are not needed for the build.
      - name: Run npm install
        run: npm install --ignore-scripts

      - name: Run Build
        run: npm run build

      # Stop here if a part of the build is missing, rather than opening a PR without it.
      - name: Check build output
        run: |
          for f in build/blocks/staxo-terms/index.js build/blocks/staxo-widget/index.js \
                   build/editor/index.js build/editor/index.asset.php build/editor/style-index.css \
                   build/common/staxo-admin.js build/common/staxo-client.js \
                   build/common/staxo-admin.css build/common/staxo-widget.css; do
            test -s "$f" || { echo "::error::Missing build output: $f"; exit 1; }
          done
          find build -type f | sort

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build/
          if-no-files-found: error
          retention-days: 1

  # Opens the PR from the built files; does not run npm.
  pr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Remove old build output
        run: rm -rf build

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: build

      - name: Open PR with build output
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Build blocks [automated]"
          title: "Automated block build"
          body: |
            Auto-generated by the Build Blocks workflow, triggered from `master`.

            Rebuilds `build/` from current `src/`.
          branch: automated/build-blocks
          delete-branch: true
