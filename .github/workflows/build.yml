name: Build Blocks

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Open PR with build output
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Build blocks [automated]"
          title: "Automated block build"
          body: |
            Auto-generated by the Build Blocks workflow, triggered from `${{ github.ref_name }}`.

            Rebuilds `build/` from current `src/`.
          branch: automated/build-blocks
          base: master
          add-paths: build
          delete-branch: true
